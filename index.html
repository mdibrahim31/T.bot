<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vendor Store Management</title>
    <!-- Tailwind CSS for modern, clean UI matching customer site -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans">

    <!-- Navbar -->
    <header class="bg-indigo-600 text-white shadow-md">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-2xl font-bold">🛍️ Vendor Store Dashboard</h1>
            <span class="text-sm bg-indigo-700 px-3 py-1 rounded-full">Live Store Manager</span>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-7xl mx-auto px-4 py-8 grid grid-cols-1 lg:grid-cols-3 gap-8">
        
        <!-- Left Column: Add / Edit Form -->
        <section class="bg-white p-6 rounded-xl shadow-sm border border-gray-100 lg:col-span-1 h-fit">
            <h2 id="formTitle" class="text-xl font-semibold mb-4 text-gray-700">Add New Item</h2>
            
            <form id="itemForm" class="space-y-4">
                <input type="hidden" id="itemId">
                
                <div>
                    <label class="block text-sm font-medium text-gray-600 mb-1">Item Title / Name</label>
                    <input type="text" id="title" required class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500" placeholder="e.g., Delicious Burger">
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-600 mb-1">Description</label>
                    <textarea id="description" rows="3" required class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500" placeholder="Write item details..."></textarea>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-600 mb-1">Price ($)</label>
                    <input type="number" step="0.01" id="price" required class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500" placeholder="e.g., 12.99">
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-600 mb-1">Image URL</label>
                    <input type="text" id="imageUrl" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500" placeholder="https://image-link.com/photo.jpg">
                </div>

                <div class="flex space-x-2">
                    <button type="submit" id="submitBtn" class="flex-1 bg-indigo-600 text-white py-2 rounded-lg font-semibold hover:bg-indigo-700 transition">Publish Item</button>
                    <button type="button" id="cancelBtn" onclick="resetForm()" class="hidden bg-gray-300 text-gray-700 px-4 py-2 rounded-lg font-semibold hover:bg-gray-400 transition">Cancel</button>
                </div>
            </form>
            <p id="statusMsg" class="mt-3 text-sm text-center font-medium"></p>
        </section>

        <!-- Right Column: Store Inventory / Menu List -->
        <section class="bg-white p-6 rounded-xl shadow-sm border border-gray-100 lg:col-span-2">
            <h2 class="text-xl font-semibold mb-4 text-gray-700">Manage Store Inventory (Menu)</h2>
            
            <div id="loading" class="text-center py-10 text-gray-400">Loading store items...</div>
            
            <!-- Items Grid -->
            <div id="itemsGrid" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <!-- Dynamic Items will load here -->
            </div>
        </section>

    </main>

    <!-- JavaScript Logic -->
    <script>
        // Supabase Credentials (Apnar project er URL & Anon Key ekhane boshaben)
        const SUPABASE_URL = 'APNAR_SUPABASE_URL';
        const SUPABASE_ANON_KEY = 'APNAR_SUPABASE_ANON_KEY';
        
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const itemForm = document.getElementById('itemForm');
        const itemsGrid = document.getElementById('itemsGrid');
        const loading = document.getElementById('loading');
        const statusMsg = document.getElementById('statusMsg');
        const formTitle = document.getElementById('formTitle');
        const submitBtn = document.getElementById('submitBtn');
        const cancelBtn = document.getElementById('cancelBtn');

        // Fetch and display items on load
        async function fetchItems() {
            loading.style.display = 'block';
            itemsGrid.innerHTML = '';

            const { data, error } = await supabase
                .from('posts')
                .select('*')
                .order('id', { ascending: false });

            loading.style.display = 'none';

            if (error) {
                console.error('Error fetching:', error);
                return;
            }

            if (data.length === 0) {
                itemsGrid.innerHTML = '<p class="text-gray-400 col-span-2 text-center">No items found in your store.</p>';
                return;
            }

            data.forEach(item => {
                const card = document.createElement('div');
                card.className = 'border border-gray-200 rounded-xl p-4 flex flex-col justify-between bg-white shadow-sm hover:shadow-md transition';
                
                card.innerHTML = `
                    <div>
                        ${item.image_url ? `<img src="${item.image_url}" class="w-full h-36 object-cover rounded-lg mb-3" alt="Item Image">` : ''}
                        <h3 class="font-bold text-lg text-gray-800">${item.title}</h3>
                        <p class="text-gray-600 text-sm mt-1 line-clamp-2">${item.description || ''}</p>
                        <p class="text-indigo-600 font-bold mt-2">$${item.price || '0.00'}</p>
                    </div>
                    <div class="flex space-x-2 mt-4 pt-3 border-t border-gray-100">
                        <button onclick="editItem(${item.id}, '${escapeHtml(item.title)}', '${escapeHtml(item.description)}', '${item.price || 0}', '${item.image_url || ''}')" class="flex-1 bg-amber-500 text-white py-1.5 rounded text-sm font-semibold hover:bg-amber-600 transition">Edit</button>
                        <button onclick="deleteItem(${item.id})" class="flex-1 bg-red-500 text-white py-1.5 rounded text-sm font-semibold hover:bg-red-600 transition">Delete</button>
                    </div>
                `;
                itemsGrid.appendChild(card);
            });
        }

        // Form Submit (Handles both Insert & Update)
        itemForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            const id = document.getElementById('itemId').value;
            const title = document.getElementById('title').value;
            const description = document.getElementById('description').value;
            const price = parseFloat(document.getElementById('price').value);
            const imageUrl = document.getElementById('imageUrl').value;

            submitBtn.disabled = true;
            statusMsg.innerText = 'Saving...';

            if (id) {
                // UPDATE
                const { error } = await supabase
                    .from('posts')
                    .update({ title, description, price, image_url: imageUrl })
                    .eq('id', id);

                if (error) {
                    statusMsg.style.color = 'red';
                    statusMsg.innerText = 'Failed to update item!';
                } else {
                    statusMsg.style.color = 'green';
                    statusMsg.innerText = 'Item updated successfully!';
                    resetForm();
                    fetchItems();
                }
            } else {
                // INSERT (New Item)
                const { error } = await supabase
                    .from('posts')
                    .insert([{ title, description, price, image_url: imageUrl }]);

                if (error) {
                    statusMsg.style.color = 'red';
                    statusMsg.innerText = 'Failed to add item!';
                } else {
                    statusMsg.style.color = 'green';
                    statusMsg.innerText = 'New item published to customer site!';
                    itemForm.reset();
                    fetchItems();
                }
            }
            submitBtn.disabled = false;
        });

        // Edit Item Setup
        window.editItem = function(id, title, description, price, imageUrl) {
            document.getElementById('itemId').value = id;
            document.getElementById('title').value = title;
            document.getElementById('description').value = description;
            document.getElementById('price').value = price;
            document.getElementById('imageUrl').value = imageUrl === 'null' ? '' : imageUrl;

            formTitle.innerText = 'Edit Menu Item';
            submitBtn.innerText = 'Update Item';
            cancelBtn.classList.remove('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // Reset Form
        window.resetForm = function() {
            itemForm.reset();
            document.getElementById('itemId').value = '';
            formTitle.innerText = 'Add New Item';
            submitBtn.innerText = 'Publish Item';
            cancelBtn.classList.add('hidden');
            statusMsg.innerText = '';
        }

        // Delete Item
        window.deleteItem = async function(id) {
            if (confirm('Are you sure you want to delete this item?')) {
                const { error } = await supabase
                    .from('posts')
                    .delete()
                    .eq('id', id);

                if (error) {
                    alert('Error deleting item!');
                } else {
                    fetchItems();
                }
            }
        }

        // Helper to avoid quote issues in inline function args
        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/'/g, "\\'").replace(/"/g, '&quot;');
        }

        // Initial fetch call
        fetchItems();
    </script>
</body>
</html>
