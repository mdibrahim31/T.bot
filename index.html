<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customer Portal - Delivery System</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; padding: 20px; background: #f4f4f9; }
    header { display: flex; justify-content: space-between; align-items: center; background: #007bff; color: white; padding: 10px 20px; borderRadius: 8px; }
    header a { color: #fff; background: #0056b3; padding: 8px 12px; text-decoration: none; border-radius: 4px; }
    .card { background: white; padding: 20px; margin-top: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    button { background: #28a745; color: white; border: none; padding: 10px 15px; border-radius: 4px; cursor: pointer; }
    button:hover { background: #218838; }
  </style>
</head>
<body>

  <header>
    <h2>🛒 Customer Store</h2>
    <!-- Vendor সাইটে যাওয়ার সুইচ লিংক -->
    <a href="./vendor/index.html">Switch to Vendor Dashboard ➔</a>
  </header>

  <div class="card">
    <h3>Burger Deluxe</h3>
    <p>Price: $5.00</p>
    <button onclick="placeOrder('Burger Deluxe', 5)">Place Order</button>
  </div>

  <div class="card">
    <h3>Pizza Margherita</h3>
    <p>Price: $8.50</p>
    <button onclick="placeOrder('Pizza Margherita', 8.5)">Place Order</button>
  </div>

  <script>
    function placeOrder(item, price) {
      alert(`Order placed successfully for ${item} ($${price})!\n(This logic will send data to Supabase)`);
      // Supabase API Integration block will come here
    }
  </script>

</body>
</html>
