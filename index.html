<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FoodHub - Vendor Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>body { font-family: 'Poppins', sans-serif; }</style>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen flex flex-col justify-between">

    <!-- Header -->
    <header class="bg-white shadow-sm sticky top-0 z-30">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-2xl font-bold text-orange-500 flex items-center gap-2">
                <i data-lucide="store"></i> FoodHub Vendor Portal
            </h1>
            <div id="vendorHeaderInfo" class="hidden flex items-center gap-3">
                <span id="activeStoreName" class="text-xs bg-orange-100 text-orange-600 px-3 py-1 rounded-full font-semibold"></span>
                <button onclick="logoutStore()" class="text-xs bg-gray-100 hover:bg-gray-200 text-gray-700 px-3 py-1 rounded-lg font-semibold transition">Switch Store</button>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-7xl mx-auto px-4 py-8 w-full flex-grow">

        <!-- STEP 1: Store Registration / Login Screen -->
        <section id="storeAuthSection" class="max-w-md mx-auto bg-white p-8 rounded-2xl shadow-sm border border-gray-100">
            <div class="text-center mb-6">
                <div class="w-12 h-12 bg-orange-100 text-orange-500 rounded-full flex items-center justify-center mx-auto mb-2 font-bold text-xl">🏪</div>
                <h2 class="text-xl font-bold text-gray-800">Register Your Restaurant</h2>
                <p class="text-xs text-gray-500 mt-1">Enter your store details to access your dashboard</p>
            </div>

            <form id="storeAuthForm" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">Restaurant Name</label>
                    <input type="text" id="regStoreName" required placeholder="e.g., Burger King" class="w-full px-3 py-2 border rounded-xl text-sm focus:outline-orange-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">Category</label>
                    <select id="regCategory" class="w-full px-3 py-2 border rounded-xl text-sm focus:outline-orange-500 bg-white">
                        <option value="Fast Food">Fast Food</option>
                        <option value="Italian">Italian</option>
                        <option value="Desi">Desi / Local</option>
                        <option value="Home Kitchen">Home Kitchen</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">Store Logo / Cover Image URL</label>
                    <input type="url" id="regImage" placeholder="https://image-link.com/logo.jpg" class="w-full px-3 py-2 border rounded-xl text-sm focus:outline-orange-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">Rating (Default)</label>
                    <input type="number" step="0.1" id="regRating" value="5.0" class="w-full px-3 py-2 border rounded-xl text-sm focus:outline-orange-500">
                </div>
                <button type="submit" class="w-full bg-orange-500 hover:bg-orange-600 text-white font-semibold py-3 rounded-xl transition text-sm shadow-md shadow-orange-500/20">Enter Store Dashboard</button>
            </form>
        </section>

        <!-- STEP 2: Vendor Dashboard (Hidden initially until store is registered/selected) -->
        <section id="dashboardSection" class="hidden grid grid-cols-1 lg:grid-cols-3 gap-8">
            
            <!-- Left Column: Add / Edit Menu Item -->
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 lg:col-span-1 h-fit">
                <h3 id="formTitle" class="text-lg font-bold mb-4 text-gray-800">Add New Menu Item</h3>
                
                <form id="menuForm" class="space-y-4">
                    <input type="hidden" id="itemId">
                    
                    <div>
                        <label class="block text-xs font-semibold text-gray-600 mb-1">Item Name</label>
                        <input type="text" id="itemName" required placeholder="e.g., Crispy Chicken Burger" class="w-full px-3 py-2 border rounded-xl text-sm focus:outline-orange-500">
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-gray-600 mb-1">Price ($)</label>
                        <input type="number" step="0.01" id="itemPrice" required placeholder="12.99" class="w-full px-3 py-2 border rounded-xl text-sm focus:outline-orange-500">
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-gray-600 mb-1">Discount (%)</label>
                        <input type="number" id="itemDiscount" value="0" placeholder="0" class="w-full px-3 py-2 border rounded-xl text-sm focus:outline-orange-500">
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-gray-600 mb-1">Food Image URL</label>
                        <input type="url" id="itemImage" placeholder="https://image-link.com/food.jpg" class="w-full px-3 py-2 border rounded-xl text-sm focus:outline-orange-500">
                    </div>

                    <div class="flex items-center gap-2">
                        <input type="checkbox" id="isBoosted" class="w-4 h-4 text-orange-500 rounded focus:ring-orange-400">
                        <label for="isBoosted" class="text-xs font-semibold text-gray-700">Boost / Feature this Deal</label>
                    </div>

                    <div class="flex gap-2 pt-2">
                        <button type="submit" id="submitBtn" class="flex-1 bg-orange-500 hover:bg-orange-600 text-white font-semibold py-2.5 rounded-xl transition text-sm shadow-md shadow-orange-500/20">Publish Item</button>
                        <button type="button" id="cancelBtn" onclick="resetForm()" class="hidden bg-gray-100 hover:bg-gray-200 text-gray-700 font-semibold px-4 py-2.5 rounded-xl transition text-sm">Cancel</button>
                    </div>
                </form>
                <p id="statusMsg" class="mt-3 text-xs text-center font-semibold"></p>
            </div>

            <!-- Right Column: Store Menu Inventory Management -->
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 lg:col-span-2">
                <h3 class="text-lg font-bold mb-4 text-gray-800">Your Store Menu Management</h3>
                <div id="loading" class="text-center py-10 text-gray-400 text-sm">Loading items...</div>
                <div id="vendorMenuGrid" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
            </div>
        </section>

    </main>

    <!-- Footer -->
    <footer class="bg-white border-t py-6 text-center text-gray-500 text-sm">
        <p>&copy; 2026 FoodHub Vendor Portal.</p>
    </footer>

    <!-- Script Logic -->
    <script>
        lucide.createIcons();

        const SUPABASE_URL = 'YOUR_SUPABASE_URL';
        const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let currentStore = JSON.parse(localStorage.getItem('foodhub_current_store')) || null;

        const storeAuthSection = document.getElementById('storeAuthSection');
        const dashboardSection = document.getElementById('dashboardSection');
        const vendorHeaderInfo = document.getElementById('vendorHeaderInfo');
        const activeStoreName = document.getElementById('activeStoreName');
        
        const storeAuthForm = document.getElementById('storeAuthForm');
        const menuForm = document.getElementById('menuForm');
        const vendorMenuGrid = document.getElementById('vendorMenuGrid');
        const loading = document.getElementById('loading');
        const statusMsg = document.getElementById('statusMsg');
        const formTitle = document.getElementById('formTitle');
        const submitBtn = document.getElementById('submitBtn');
        const cancelBtn = document.getElementById('cancelBtn');

        // Check if store already logged in from browser memory
        if (currentStore) {
            showDashboard();
        }

        // Handle Store Registration / Login
        storeAuthForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('regStoreName').value.trim();
            const category = document.getElementById('regCategory').value;
            const image = document.getElementById('regImage').value.trim();
            const rating = parseFloat(document.getElementById('regRating').value) || 5.0;

            // Check if restaurant already exists in database
            const { data: existing, error: findError } = await supabaseClient
                .from('restaurants')
                .select('*')
                .eq('name', name)
                .single();

            if (existing) {
                // Store already registered, log in directly
                currentStore = existing;
            } else {
                // Register new store in 'restaurants' table
                const { data: newRes, error: insertError } = await supabaseClient
                    .from('restaurants')
                    .insert([{ name, category, image, rating }])
                    .select()
                    .single();

                if (insertError) {
                    alert("Failed to register store!");
                    return;
                }
                currentStore = newRes;
            }

            localStorage.setItem('foodhub_current_store', JSON.stringify(currentStore));
            showDashboard();
        });

        function showDashboard() {
            storeAuthSection.classList.add('hidden');
            dashboardSection.classList.remove('hidden');
            vendorHeaderInfo.classList.remove('hidden');
            activeStoreName.innerText = `Store: ${currentStore.name}`;
            fetchVendorMenus();
        }

        function logoutStore() {
            localStorage.removeItem('foodhub_current_store');
            currentStore = null;
            dashboardSection.classList.add('hidden');
            vendorHeaderInfo.classList.add('hidden');
            storeAuthSection.classList.remove('hidden');
        }

        // Fetch Menus specific to this logged-in restaurant
        async function fetchVendorMenus() {
            loading.style.display = 'block';
            vendorMenuGrid.innerHTML = '';

            const { data, error } = await supabaseClient
                .from('menus')
                .select('*')
                .eq('restaurant_id', currentStore.id)
                .order('id', { ascending: false });

            loading.style.display = 'none';

            if (error) {
                console.error("Error:", error);
                return;
            }

            if (data.length === 0) {
                vendorMenuGrid.innerHTML = `<p class="col-span-full text-center text-gray-400 text-sm py-6">No menu items found. Add your first item!</p>`;
                return;
            }

            data.forEach(item => {
                vendorMenuGrid.innerHTML += `
                    <div class="border border-gray-100 rounded-2xl p-4 flex flex-col justify-between bg-white shadow-sm hover:shadow-md transition">
                        <div>
                            ${item.image ? `<img src="${item.image}" class="w-full h-32 object-cover rounded-xl mb-3">` : ''}
                            <h4 class="font-bold text-gray-800 text-sm">${item.name}</h4>
                            <p class="text-orange-500 font-bold text-sm mt-1">$${item.price} ${item.discount > 0 ? `<span class="text-xs text-red-500 font-normal">(${item.discount}% off)</span>` : ''}</p>
                            ${item.is_boosted ? `<span class="inline-block mt-2 text-[10px] bg-red-100 text-red-600 px-2 py-0.5 rounded-full font-semibold">Boosted Deal</span>` : ''}
                        </div>
                        <div class="flex gap-2 mt-4 pt-3 border-t">
                            <button onclick="editItem(${item.id}, '${escapeHtml(item.name)}', ${item.price}, ${item.discount || 0}, '${item.image || ''}', ${item.is_boosted})" class="flex-1 bg-amber-500 hover:bg-amber-600 text-white py-1.5 rounded-xl text-xs font-semibold transition">Edit</button>
                            <button onclick="deleteItem(${item.id})" class="flex-1 bg-red-500 hover:bg-red-600 text-white py-1.5 rounded-xl text-xs font-semibold transition">Delete</button>
                        </div>
                    </div>
                `;
            });
            lucide.createIcons();
        }

        // Add / Update Menu Form Submission
        menuForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            const id = document.getElementById('itemId').value;
            const name = document.getElementById('itemName').value;
            const price = parseFloat(document.getElementById('itemPrice').value);
            const discount = parseFloat(document.getElementById('itemDiscount').value) || 0;
            const image = document.getElementById('itemImage').value;
            const is_boosted = document.getElementById('isBoosted').checked;
            const restaurant_id = currentStore.id;

            submitBtn.disabled = true;
            statusMsg.innerText = 'Saving...';

            if (id) {
                // Update
                const { error } = await supabaseClient
                    .from('menus')
                    .update({ name, price, discount, image, is_boosted })
                    .eq('id', id);

                if (error) {
                    statusMsg.style.color = 'red';
                    statusMsg.innerText = 'Update failed!';
                } else {
                    statusMsg.style.color = 'green';
                    statusMsg.innerText = 'Item updated successfully!';
                    resetForm();
                    fetchVendorMenus();
                }
            } else {
                // Insert New Menu Item linked to current store ID
                const { error } = await supabaseClient
                    .from('menus')
                    .insert([{ restaurant_id, name, price, discount, image, is_boosted }]);

                if (error) {
                    statusMsg.style.color = 'red';
                    statusMsg.innerText = 'Failed to add item!';
                } else {
                    statusMsg.style.color = 'green';
                    statusMsg.innerText = 'Published to customer site!';
                    menuForm.reset();
                    fetchVendorMenus();
                }
            }
            submitBtn.disabled = false;
        });

        window.editItem = function(id, name, price, discount, image, isBoosted) {
            document.getElementById('itemId').value = id;
            document.getElementById('itemName').value = name;
            document.getElementById('itemPrice').value = price;
            document.getElementById('itemDiscount').value = discount;
            document.getElementById('itemImage').value = image === 'null' ? '' : image;
            document.getElementById('isBoosted').checked = isBoosted;

            formTitle.innerText = 'Edit Menu Item';
            submitBtn.innerText = 'Update Menu';
            cancelBtn.classList.remove('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        window.resetForm = function() {
            menuForm.reset();
            document.getElementById('itemId').value = '';
            formTitle.innerText = 'Add New Menu Item';
            submitBtn.innerText = 'Publish Item';
            cancelBtn.classList.add('hidden');
            statusMsg.innerText = '';
        }

        window.deleteItem = async function(id) {
            if (confirm('Are you sure you want to delete this menu item?')) {
                const { error } = await supabaseClient.from('menus').delete().eq('id', id);
                if (error) alert('Error deleting item!');
                else fetchVendorMenus();
            }
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/'/g, "\\'").replace(/"/g, '&quot;');
        }
    </script>
</body>
</html>
